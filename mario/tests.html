<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Clone - Tests</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-suite {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-case {
            padding: 10px;
            margin: 5px 0;
            border-left: 4px solid #ccc;
            background: #f9f9f9;
        }
        .test-case.pass {
            border-left-color: #4caf50;
            background: #e8f5e9;
        }
        .test-case.fail {
            border-left-color: #f44336;
            background: #ffebee;
        }
        .test-case.pending {
            border-left-color: #ff9800;
            background: #fff3e0;
        }
        h1 { color: #333; }
        h2 { color: #666; margin-top: 0; }
        .summary {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 4px;
        }
        .error-details {
            color: #c62828;
            font-size: 12px;
            margin-top: 5px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Mario Clone - Test Suite</h1>
    <div id="test-results"></div>

    <script>
        const testResults = [];

        class TestRunner {
            constructor(suiteName) {
                this.suiteName = suiteName;
                this.tests = [];
            }

            test(name, fn) {
                this.tests.push({ name, fn });
            }

            async run() {
                console.log(`\n=== Running ${this.suiteName} ===`);
                const results = [];

                for (const test of this.tests) {
                    try {
                        await test.fn();
                        results.push({ name: test.name, status: 'pass' });
                        console.log(`✓ ${test.name}`);
                    } catch (error) {
                        results.push({ name: test.name, status: 'fail', error: error.message });
                        console.error(`✗ ${test.name}: ${error.message}`);
                    }
                }

                return { suite: this.suiteName, results };
            }
        }

        function assert(condition, message) {
            if (!condition) {
                throw new Error(message || 'Assertion failed');
            }
        }

        function assertEqual(actual, expected, message) {
            if (actual !== expected) {
                throw new Error(message || `Expected ${expected}, got ${actual}`);
            }
        }

        // Test Suite 1: DOM Elements
        const domTests = new TestRunner('DOM Elements');

        domTests.test('Game canvas exists', () => {
            const canvas = document.getElementById('gameCanvas');
            assert(canvas, 'Canvas element not found');
            assert(canvas.tagName === 'CANVAS', 'Element is not a canvas');
        });

        domTests.test('Touch control buttons exist', () => {
            const leftBtn = document.getElementById('btn-left');
            const rightBtn = document.getElementById('btn-right');
            const jumpBtn = document.getElementById('btn-jump');

            assert(leftBtn, 'Left button not found');
            assert(rightBtn, 'Right button not found');
            assert(jumpBtn, 'Jump button not found');
        });

        domTests.test('Start screen exists', () => {
            const startScreen = document.getElementById('start-screen');
            const startBtn = document.getElementById('start-btn');

            assert(startScreen, 'Start screen not found');
            assert(startBtn, 'Start button not found');
        });

        domTests.test('Game UI elements exist', () => {
            const score = document.getElementById('score');
            const coins = document.getElementById('coins');
            const lives = document.getElementById('lives');

            assert(score, 'Score element not found');
            assert(coins, 'Coins element not found');
            assert(lives, 'Lives element not found');
        });

        // Test Suite 2: Game State
        const gameStateTests = new TestRunner('Game State');

        gameStateTests.test('gameState object exists', () => {
            assert(typeof gameState !== 'undefined', 'gameState not defined');
            assert(typeof gameState === 'object', 'gameState is not an object');
        });

        gameStateTests.test('gameState has required properties', () => {
            assert('running' in gameState, 'gameState missing running property');
            assert('score' in gameState, 'gameState missing score property');
            assert('coins' in gameState, 'gameState missing coins property');
            assert('lives' in gameState, 'gameState missing lives property');
            assert('touchControls' in gameState, 'gameState missing touchControls property');
        });

        gameStateTests.test('touchControls initialized correctly', () => {
            assert('left' in gameState.touchControls, 'touchControls missing left');
            assert('right' in gameState.touchControls, 'touchControls missing right');
            assert('jump' in gameState.touchControls, 'touchControls missing jump');
        });

        // Test Suite 3: Configuration
        const configTests = new TestRunner('Configuration');

        configTests.test('CONFIG object exists', () => {
            assert(typeof CONFIG !== 'undefined', 'CONFIG not defined');
        });

        configTests.test('CONFIG has physics properties', () => {
            assert('GRAVITY' in CONFIG, 'CONFIG missing GRAVITY');
            assert('JUMP_POWER' in CONFIG, 'CONFIG missing JUMP_POWER');
            assert('MOVE_SPEED' in CONFIG, 'CONFIG missing MOVE_SPEED');
        });

        configTests.test('Jump power is reasonable', () => {
            assert(CONFIG.JUMP_POWER < 0, 'Jump power should be negative');
            assert(CONFIG.JUMP_POWER >= -15, 'Jump power too large');
        });

        // Test Suite 4: Functions
        const functionTests = new TestRunner('Functions');

        functionTests.test('startGame function exists', () => {
            assert(typeof startGame === 'function', 'startGame is not a function');
        });

        functionTests.test('setupTouchControls function exists', () => {
            assert(typeof setupTouchControls === 'function', 'setupTouchControls is not a function');
        });

        functionTests.test('initLevel function exists', () => {
            assert(typeof initLevel === 'function', 'initLevel is not a function');
        });

        // Test Suite 5: Audio
        const audioTests = new TestRunner('Audio System');

        audioTests.test('Audio context exists', () => {
            assert(typeof audioContext !== 'undefined', 'audioContext not defined');
        });

        audioTests.test('Sound functions exist', () => {
            assert(typeof sounds === 'object', 'sounds object not found');
            assert(typeof sounds.jump === 'function', 'jump sound not found');
            assert(typeof sounds.coin === 'function', 'coin sound not found');
        });

        // Test Suite 6: Haptics
        const hapticTests = new TestRunner('Haptics System');

        hapticTests.test('Haptics object exists', () => {
            assert(typeof haptics === 'object', 'haptics object not found');
        });

        hapticTests.test('Haptic functions exist', () => {
            assert(typeof haptics.light === 'function', 'light haptic not found');
            assert(typeof haptics.medium === 'function', 'medium haptic not found');
            assert(typeof haptics.heavy === 'function', 'heavy haptic not found');
        });

        // Test Suite 7: PWA
        const pwaTests = new TestRunner('PWA Support');

        pwaTests.test('Manifest link exists', () => {
            const manifest = document.querySelector('link[rel="manifest"]');
            assert(manifest, 'Manifest link not found');
        });

        pwaTests.test('Service worker registration attempted', () => {
            assert('serviceWorker' in navigator, 'Service Worker not supported');
        });

        // Run all tests
        async function runAllTests() {
            const suites = [
                domTests,
                gameStateTests,
                configTests,
                functionTests,
                audioTests,
                hapticTests,
                pwaTests
            ];

            const allResults = [];
            for (const suite of suites) {
                const result = await suite.run();
                allResults.push(result);
            }

            displayResults(allResults);
        }

        function displayResults(allResults) {
            const container = document.getElementById('test-results');
            let totalTests = 0;
            let passedTests = 0;
            let failedTests = 0;

            allResults.forEach(({ suite, results }) => {
                const suiteDiv = document.createElement('div');
                suiteDiv.className = 'test-suite';

                const title = document.createElement('h2');
                title.textContent = suite;
                suiteDiv.appendChild(title);

                results.forEach(test => {
                    totalTests++;
                    const testDiv = document.createElement('div');
                    testDiv.className = `test-case ${test.status}`;

                    const status = test.status === 'pass' ? '✓' : '✗';
                    testDiv.innerHTML = `<strong>${status} ${test.name}</strong>`;

                    if (test.error) {
                        failedTests++;
                        const errorDiv = document.createElement('div');
                        errorDiv.className = 'error-details';
                        errorDiv.textContent = test.error;
                        testDiv.appendChild(errorDiv);
                    } else {
                        passedTests++;
                    }

                    suiteDiv.appendChild(testDiv);
                });

                container.appendChild(suiteDiv);
            });

            const summary = document.createElement('div');
            summary.className = 'summary';
            summary.innerHTML = `
                <div>Total Tests: ${totalTests}</div>
                <div style="color: #4caf50;">Passed: ${passedTests}</div>
                <div style="color: #f44336;">Failed: ${failedTests}</div>
                <div style="margin-top: 10px;">Success Rate: ${Math.round(passedTests/totalTests * 100)}%</div>
            `;
            container.appendChild(summary);
        }

        // Wait for game to load, then run tests
        window.addEventListener('load', () => {
            setTimeout(() => {
                runAllTests();
            }, 500);
        });
    </script>

    <!-- Load game scripts -->
    <canvas id="gameCanvas" style="display:none;"></canvas>
    <div id="touch-controls" style="display:none;">
        <button id="btn-left"></button>
        <button id="btn-right"></button>
        <button id="btn-jump"></button>
    </div>
    <div id="start-screen" style="display:none;">
        <button id="start-btn"></button>
    </div>
    <div id="game-ui" style="display:none;">
        <div><span id="score"></span></div>
        <div><span id="coins"></span></div>
        <div><span id="lives"></span></div>
    </div>
    <script src="game.js"></script>
</body>
</html>
